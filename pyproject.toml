[project]
name = "workshop"
version = "0.1.0"
description = "AutoCon6 workshop: Know Before You Deploy - network CI/CD with Forward Predict"
requires-python = ">=3.12"
dependencies = [
    "forward-sdk==0.1.20",
    "netmiko==4.7.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
workshop = "workshop.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "httpx>=0.27,<1",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workshop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' -ra"
markers = [
    "live: requires a running lab and a reachable Forward instance",
]
timeout = 120

[tool.ruff]
line-length = 100
target-version = "py312"
