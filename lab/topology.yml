# AutoCon6 four-router eBGP diamond. netlab builds the lab AND configures it: `netlab up` renders each router's
# configuration from this file (its modules plus the three custom templates next to it) and pushes it with Netmiko.
# After that, every change to a router goes through NAPALM (src/workshop/executor.py), never through netlab.
name: autocon6
# Use only this project's defaults and netlab's packaged ones. The host carries a machine-wide
# ~/.netlab.yml and /etc/netlab/defaults.yml for other labs (Skyforge); neither may leak in.
defaults.sources.user: [ ./netlab-defaults.yml ]
defaults.sources.system: [ package:topology-defaults.yml ]
provider: clab

module: [ bgp ]
plugin: [ bgp.policy, multilab ]

# multilab gives this lab its own netlab instance id, management network (192.168.<id>.0/24)
# and docker network so it can coexist with other labs on the same host. Keep the lab name
# stable ("autocon6") instead of the plugin's default "ml-<id>".
defaults.multilab:
  id: 121
  change:
    name: autocon6
    defaults.name: autocon6

addressing:
  p2p:
    ipv4: 10.255.0.0/24
    prefix: 30
  # The client's and the service's subnets, as pools: netlab gives every host a static route through its router for
  # each address pool, so the client reaches 10.20.20.0/24 through r1 and the service answers through r4.
  clients:
    ipv4: 10.10.0.0/16
    prefix: 24
  services:
    ipv4: 10.20.0.0/16
    prefix: 24
  mgmt:
    start: 100

bgp:
  advertise_loopback: false

# Custom configuration templates (lab/*.j2), applied by netlab after its modules:
#   no-mgmt-default  every router: no default route via the management bridge
#   client-in        r1: the CLIENT-IN ACL (8080 allowed, 2222 denied)
#   stale-adverts    r4: the two stale network statements the exercises retire
nodes:
  r1: { bgp.as: 65001, config: [ no-mgmt-default, client-in ] }
  r2: { bgp.as: 65002, config: [ no-mgmt-default ] }
  r3: { bgp.as: 65003, config: [ no-mgmt-default ] }
  r4: { bgp.as: 65004, config: [ no-mgmt-default, stale-adverts ] }
  client:
    device: linux
    role: host
  service:
    device: linux
    role: host
    clab.exec:
      - sh -c 'nohup python3 -m http.server 8080 --bind 0.0.0.0 >/dev/null 2>&1 &'
      - sh -c 'nohup python3 -m http.server 8443 --bind 0.0.0.0 >/dev/null 2>&1 &'
      - sh -c 'nohup python3 -m http.server 2222 --bind 0.0.0.0 >/dev/null 2>&1 &'

links:
# Primary path R1-R2-R4: local preference 200 on routes learned from R2 at both edges.
- r1: { bgp.locpref: 200 }
  r2:
- r1-r3
- r2:
  r4: { bgp.locpref: 200 }
- r3-r4
# Endpoints
- client: { ipv4: 10.10.10.10/24 }
  r1:     { ipv4: 10.10.10.1/24 }
- service: { ipv4: 10.20.20.20/24 }
  r4:      { ipv4: 10.20.20.1/24 }
